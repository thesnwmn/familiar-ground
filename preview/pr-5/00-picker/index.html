<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Familiar Ground: Pick a Place</title>
    <script type="module" crossorigin src="./assets/index-Bji1F6U9.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-Baif-tHA.css">
  </head>
  <body>
    <div id="map"></div>
    <aside id="panel">
      <h1>Familiar Ground</h1>
      <p class="hint">Click anywhere on the map to choose where your world starts.</p>
      <form id="search">
        <input id="q" type="search" placeholder="Search a place…" aria-label="Search a place" />
        <button type="submit">Go</button>
      </form>
      <label class="row">
        Seed
        <input id="seed" type="number" min="0" step="1" />
        <button id="reroll" type="button" title="Random seed">🎲</button>
      </label>
      <fieldset>
        <legend>Style</legend>
        <div id="styles"></div>
      </fieldset>
      <p id="picked" class="coords">No location picked yet.</p>
      <div id="play"></div>
      <p class="hint"><a id="lab" href="../02-gallery/">Browse the style lab →</a> (dozens of styles, no playing needed)</p>
    </aside>
  </body>
</html>
