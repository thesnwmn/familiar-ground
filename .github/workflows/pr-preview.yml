name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:site

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          target-folder: preview/pr-${{ github.event.pull_request.number }}
          clean: true

      - uses: actions/github-script@v7
        with:
          script: |
            const prNum  = context.issue.number;
            const url    = `https://${context.repo.owner}.github.io/${context.repo.repo}/preview/pr-${prNum}/`;
            const marker = '<!-- familiar-ground-preview -->';
            const body   = `${marker}\n🗺️ **Preview:** ${url}\n\n_Updated for ${context.payload.pull_request.head.sha.slice(0, 7)}. Removed when the PR is closed._`;

            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNum,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: prNum, body });
            }
